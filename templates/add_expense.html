{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-sm-8">
    <div class="card p-4">
      <div class="d-flex align-items-center mb-3">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="mb-0 fw-bold">Add New Expense</h4>
      </div>

      <div class="alert alert-light border small text-muted mb-4">
        Adding as: <strong>{{ current_user.name }}</strong> &bull; You will have <strong>12 minutes</strong> to edit or fix mistakes directly after adding!
      </div>

      <form method="post" action="{{ url_for('add_expense') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Description / Purpose</label>
          <input type="text" name="description" class="form-control form-control-lg" placeholder="e.g. 2L Visa Payment, Groceries, Flight ticket" required autofocus>
          <div class="form-text">Clearly mention what this money was spent for.</div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-8">
            <label class="form-label fw-semibold">Amount</label>
            <input type="number" step="0.01" name="amount" class="form-control form-control-lg" placeholder="0.00" required min="0.01">
          </div>
          <div class="col-4">
            <label class="form-label fw-semibold">Currency</label>
            <select name="currency" class="form-select form-select-lg">
              <option value="INR" selected>INR (₹)</option>
              <option value="AED">AED (Dirham)</option>
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
            </select>
          </div>
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary btn-lg fw-bold">
            <i class="bi bi-check2-circle me-1"></i> Save Expense
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-light">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
